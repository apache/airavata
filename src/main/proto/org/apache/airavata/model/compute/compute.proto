syntax = "proto3";

package org.apache.airavata.api.gatewayprofile;

option java_package = "org.apache.airavata.api.gatewayprofile";
option java_multiple_files = true;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "org/apache/airavata/model/appcatalog/gatewayprofile/gateway_profile.proto";
import "org/apache/airavata/model/appcatalog/accountprovisioning/account_provisioning.proto";
import "org/apache/airavata/model/commons/commons.proto";


// A GatewayResourceProfile unioned with the caller's access flags (see commons.AccessFlags).
// A gateway resource profile is a gateway-level entity with no owner and no sharing entity,
// so is_owner is always false and user_has_write_access reflects gateway-admin (admin-rw).
message GatewayResourceProfileWithAccess {
  org.apache.airavata.model.appcatalog.gatewayprofile.GatewayResourceProfile gateway_resource_profile = 1;
  org.apache.airavata.model.commons.AccessFlags access = 2;
}