# Local development only: test users and a client secret for a Dex instance on localhost.
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  passwordConnector: local
  skipApprovalScreen: true

staticClients:
  - id: airavata
    secret: airavata-dev-secret
    name: Airavata (local)
    redirectURIs:
      - http://localhost:9095/dashboard/login/callback/
      - http://127.0.0.1:9095/dashboard/login/callback/

enablePasswordDB: true

# Every user's password is "password".
staticPasswords:
  - email: alice@example.com
    hash: "$2y$10$5/T9IhShRjEkP2SpWxgG4ugKI2OU80PC6PtOxwnJvJBmtYAlNqd.i"
    username: alice
    userID: "1001"
  - email: bob@example.com
    hash: "$2y$10$5/T9IhShRjEkP2SpWxgG4ugKI2OU80PC6PtOxwnJvJBmtYAlNqd.i"
    username: bob
    userID: "1002"
