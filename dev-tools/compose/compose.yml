services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airavata
      POSTGRES_USER: airavata
      POSTGRES_PASSWORD: 123456
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airavata -d airavata"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mock-slurm:
    build:
      context: ./mock-slurm
      dockerfile: Dockerfile
    image: airavata-mock-slurm:latest
    container_name: mock-slurm
    restart: unless-stopped
    ports:
      - "12222:22"
    volumes:
      - mock_slurm_scratch:/home/slurmuser/scratch
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/22' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  postgres_data:
  mock_slurm_scratch:

