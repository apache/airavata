openapi: 3.1.0

info:
  title: Apache Airavata HTTP API
  version: "1.0.0"
  description: |
    The REST API served by `airavata-server` (see `internal/server/server.go`).

    All request and response bodies are JSON (`Content-Type: application/json`).

    ## Authentication

    Authentication is a bearer token validated by CILogon introspection, carried as
    `Authorization: Bearer <token>`. A request without a token is anonymous rather
    than rejected at the door: each operation decides for itself whether an anonymous
    caller is acceptable. A token that is present but invalid is always `401`, with
    `WWW-Authenticate: Bearer error="invalid_token"`. If the identity provider cannot
    be reached the call fails `502`, because that is not the caller's fault.

    ## Authorization

    Two schemes are in play, depending on the resource:

    - **Platform roles** (`ADMIN`, `SUPER_ADMIN`) guard the shared catalogue —
      Slurm clusters, partitions, application templates and batch deployments.
      Reads of the catalogue are open to anyone, including anonymous callers;
      writes require a role.
    - **Ownership and sharing** guards the per-user resources — SSH keys, groups,
      cluster configs, SCP data storages, data products and processes. Ownership
      comes from the token and is never carried in a request body, so nothing can be
      created on someone else's behalf or handed over by editing it. None of these
      are readable anonymously.

    SSH keys are the strictest case: platform admins are not treated as owners, and
    there is no share that opens a key up. Private key material and passphrases are
    write-only — no read endpoint has a field for them.

    ## Errors

    Every failure uses the same envelope (`Error`). Request-body validation adds a
    `fieldErrors` array naming every constraint that failed, using the JSON path of
    the offending field including indexes and nesting (`inputs[0].inputType`,
    `defaultBatchJobConfig.wallTimeMinutes`).

    Internal failures return `500` with a fixed `"Internal server error"` message;
    the underlying detail is logged rather than returned, since it may name internal
    state.
  license:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:9095
    description: Local development server (override the port with `SERVER_PORT`)

tags:
  - name: Health
    description: Liveness probe.
  - name: Users
    description: User accounts.
  - name: Groups
    description: Groups and their membership; the subject of a group share.
  - name: SSH Keys
    description: Registered keypairs. Private material is write-only.
  - name: Slurm Clusters
    description: The machine catalogue and its partitions.
  - name: Slurm Cluster Configs
    description: Who a job submits as on a cluster, and with which key.
  - name: Application Templates
    description: An application's input/output contract, independent of where it runs.
  - name: Batch Deployments
    description: A template bound to a cluster, with the resource request a run starts from.
  - name: SCP Data Storages
    description: Hosts data is staged to and from over SCP.
  - name: Data Products
    description: Registered datasets on a storage.
  - name: Processes
    description: Runs, their status history and their tasks.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        No token is required. The authentication middleware wraps the whole mux
        rather than individual routes, so a request that does carry a token still has
        it validated — call this without an `Authorization` header to probe liveness
        independently of the identity provider.
      operationId: health
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
                required: [status]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ---------------------------------------------------------------- Users

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: listUsers
      responses:
        "200":
          description: Every registered user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Users]
      summary: Register a user
      description: |
        Creates the `users` row an owned resource is attached to. Owning anything in
        this API requires such a row.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRegistration" }
      responses:
        "200":
          description: The registered user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Read a user
      description: |
        The response carries no email, auth method or roles — widening it would leak
        more about an account than this API ever has.
      operationId: getUser
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Users]
      summary: Update a user
      description: |
        Update the user with the provided information.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRegistration" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  # --------------------------------------------------------------- Groups

  /api/v1/groups:
    get:
      tags: [Groups]
      summary: List all groups
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: listGroups
      responses:
        "200":
          description: Every group.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Groups]
      summary: Create a group
      description: |
        The owner is taken from the token — there is no owner field — and is not
        transferable afterwards.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRequest" }
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/groups/me:
    get:
      tags: [Groups]
      summary: List the caller's groups
      description: The groups the caller owns or is a member of.
      operationId: listMyGroups
      responses:
        "200":
          description: The caller's groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: Read a group
      description: |
        A caller with no standing to know the group exists gets `404` rather than
        `403`. Members are not inlined; read them through the members sub-resource.
      operationId: getGroup
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Groups]
      summary: Update a group
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupRequest" }
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Groups]
      summary: Delete a group
      operationId: deleteGroup
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: List group members
      operationId: listGroupMembers
      responses:
        "200":
          description: The group's memberships.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupMemberResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Groups]
      summary: Add a group member
      description: |
        An omitted `groupRole` admits a plain `MEMBER`; an omitted
        `groupMemberStatus` admits them as `ACTIVE`.
      operationId: addGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMemberRequest" }
      responses:
        "201":
          description: The created membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Groups]
      summary: Read one membership
      operationId: getGroupMember
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Groups]
      summary: Update a membership
      description: |
        Both fields are optional and an omitted one is left as it stands, so a member
        can be suspended without restating their role. The user is identified by the
        path, so a membership cannot be moved to a different user by editing it.
      operationId: updateGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMemberUpdate" }
      responses:
        "200":
          description: The updated membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Groups]
      summary: Remove a member from a group
      operationId: removeGroupMember
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------------- SSH keys

  /api/v1/ssh-keys:
    get:
      tags: [SSH Keys]
      summary: List the caller's SSH keys
      description: Returns only the caller's own keys. Admins are not exempt.
      operationId: listSSHKeys
      responses:
        "200":
          description: The caller's keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [SSH Keys]
      summary: Register an SSH key
      description: |
        Self-service for any authenticated caller with a `users` row. `privateKey` is
        required on create; `privateKey` and `passphrase` are write-only and are never
        returned by any read endpoint.
      operationId: createSSHKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHKeyRequest" }
      responses:
        "201":
          description: The registered key, without its private material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKeyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ssh-keys/{sshKeyId}:
    parameters:
      - $ref: "#/components/parameters/SSHKeyId"
    get:
      tags: [SSH Keys]
      summary: Read an SSH key
      description: Owner only.
      operationId: getSSHKey
      responses:
        "200":
          description: The key, without its private material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [SSH Keys]
      summary: Update an SSH key
      description: |
        Owner only. An update that omits `privateKey` keeps the stored secret.
      operationId: updateSSHKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHKeyRequest" }
      responses:
        "200":
          description: The updated key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKeyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [SSH Keys]
      summary: Delete an SSH key
      description: |
        Owner only. A key still referenced by a cluster config or a data storage
        cannot be deleted: `409 Conflict`.
      operationId: deleteSSHKey
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------- Slurm clusters

  /api/v1/slurm-clusters:
    get:
      tags: [Slurm Clusters]
      summary: List Slurm clusters
      description: Catalogue read; open without a token.
      operationId: listSlurmClusters
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Every registered cluster, with its partitions inlined.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SlurmClusterResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Slurm Clusters]
      summary: Register a Slurm cluster
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. Describes the machine only — the
        account a job submits under and the key it presents are a cluster config, so
        registering a cluster never puts anyone's credentials into the catalogue.

        `partitions` is accepted on create so a cluster whose layout is already known
        arrives complete.
      operationId: createSlurmCluster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlurmClusterRequest" }
      responses:
        "201":
          description: The registered cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlurmClusterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-clusters/{slurmClusterId}:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterId"
    get:
      tags: [Slurm Clusters]
      summary: Read a Slurm cluster
      description: Catalogue read; open without a token.
      operationId: getSlurmCluster
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The cluster, with its partitions inlined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlurmClusterResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Slurm Clusters]
      summary: Update a Slurm cluster
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. An update carrying `partitions`
        is rejected: the set has no ids to match rows by, and replacing the collection
        wholesale would delete partitions the caller never mentioned. Use the
        partition sub-resource instead.
      operationId: updateSlurmCluster
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlurmClusterRequest" }
      responses:
        "200":
          description: The updated cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlurmClusterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Slurm Clusters]
      summary: Delete a Slurm cluster
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: deleteSlurmCluster
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-clusters/{slurmClusterId}/partitions:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterId"
    get:
      tags: [Slurm Clusters]
      summary: List a cluster's partitions
      description: Catalogue read; open without a token.
      operationId: listClusterPartitions
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The cluster's partitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClusterPartitionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Slurm Clusters]
      summary: Add a partition to a cluster
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: createClusterPartition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterPartitionRequest" }
      responses:
        "201":
          description: The created partition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterPartitionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
