  # ------------------------------------------------- Slurm cluster configs

  /api/v1/slurm-cluster-configs:
    get:
      tags: [Slurm Cluster Configs]
      summary: List all cluster configs
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: listSlurmClusterConfigs
      responses:
        "200":
          description: Every config.
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Slurm Cluster Configs]
      summary: Create a cluster config
      description: |
        Names the account a job submits under on a cluster, the key it presents and
        the directory it works beneath. The owner comes from the token. The key must
        be one the caller owns — assigning someone else's key is `403`.
      operationId: createSlurmClusterConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlurmClusterConfigRequest" }
      responses:
        "201":
          description: The created config.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/me:
    get:
      tags: [Slurm Cluster Configs]
      summary: List the caller's cluster configs
      operationId: listMySlurmClusterConfigs
      responses:
        "200":
          description: The configs the caller owns.
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/shared-with-me:
    get:
      tags: [Slurm Cluster Configs]
      summary: List cluster configs shared with the caller
      description: |
        Each entry carries `permission`, the caller's effective standing — the
        strongest of the shares reaching them. A group share counts only while the
        membership is `ACTIVE`.
      operationId: listSlurmClusterConfigsSharedWithMe
      responses:
        "200":
          description: The configs shared with the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/{slurmClusterConfigId}:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterConfigId"
    get:
      tags: [Slurm Cluster Configs]
      summary: Read a cluster config
      description: |
        Requires a `READ` standing: owner, admin, or a share. The cluster is inlined,
        and the key as its safe summary — name and public key only.
      operationId: getSlurmClusterConfig
      responses:
        "200":
          description: The config.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Slurm Cluster Configs]
      summary: Update a cluster config
      description: |
        Requires a `WRITE` standing. Re-presenting the key the config already holds is
        not an assignment, which is what lets a `WRITE` grantee edit a config without
        owning the key on it.
      operationId: updateSlurmClusterConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlurmClusterConfigRequest" }
      responses:
        "200":
          description: The updated config.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SlurmClusterConfigResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Slurm Cluster Configs]
      summary: Delete a cluster config
      description: Owner or admin.
      operationId: deleteSlurmClusterConfig
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/{slurmClusterConfigId}/group-shares:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterConfigId"
    get:
      tags: [Slurm Cluster Configs]
      summary: List a config's group shares
      description: Owner or admin.
      operationId: listSlurmClusterConfigGroupShares
      responses:
        "200":
          description: The group shares on this config.
          content:
            application/json:
              schema:
                type: array
                items:
                  {
                    $ref: "#/components/schemas/SlurmClusterConfigGroupSharingResponse",
                  }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Slurm Cluster Configs]
      summary: Share a config with a group
      description: An omitted `permission` grants `READ`.
      operationId: shareSlurmClusterConfigWithGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/SlurmClusterConfigGroupSharingRequest",
              }
      responses:
        "201":
          description: The created share.
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/SlurmClusterConfigGroupSharingResponse",
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/{slurmClusterConfigId}/group-shares/{sharingId}:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterConfigId"
      - $ref: "#/components/parameters/SharingId"
    put:
      tags: [Slurm Cluster Configs]
      summary: Change what a group share grants
      description: The subject is fixed at creation; only the permission is editable.
      operationId: updateSlurmClusterConfigGroupShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/SlurmClusterConfigSharingUpdate" }
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/SlurmClusterConfigGroupSharingResponse",
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Slurm Cluster Configs]
      summary: Revoke a group share
      operationId: revokeSlurmClusterConfigGroupShare
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-cluster-configs/{slurmClusterConfigId}/user-shares:
    parameters:
      - $ref: "#/components/parameters/SlurmClusterConfigId"
    get:
