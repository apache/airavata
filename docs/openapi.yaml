      summary: Delete a process
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: deleteProcess
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/processes/{processId}/launch:
    parameters:
      - $ref: "#/components/parameters/ProcessId"
    post:
      tags: [Processes]
      summary: Launch a process
      description: |
        Owner only. Takes no body. Answers `202`: the tasks are recorded here, and
        carrying them out is later work done elsewhere. The body is the process
        itself, so a caller that launched by id has the run to hand. What the launch
        produced is read back through the process's task collections.
      operationId: launchProcess
      responses:
        "202":
          description: The launch was accepted; the process is returned as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
