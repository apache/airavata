      description: Catalogue read; open without a token.
      operationId: getBatchDeployment
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDeploymentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Batch Deployments]
      summary: Update a batch deployment
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: updateBatchDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchDeploymentRequest" }
      responses:
        "200":
          description: The updated deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDeploymentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Batch Deployments]
      summary: Delete a batch deployment
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: deleteBatchDeployment
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
