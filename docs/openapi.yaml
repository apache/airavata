components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A CILogon access token, validated by RFC 7662 introspection. The bootstrap
        root token is also accepted; see INSTALL.md.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    SSHKeyId:
      name: sshKeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlurmClusterId:
      name: slurmClusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartitionId:
      name: partitionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlurmClusterConfigId:
      name: slurmClusterConfigId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DataStorageId:
      name: dataStorageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DataProductId:
      name: dataProductId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProcessId:
      name: processId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SharingId:
      name: sharingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NoContent:
      description: Deleted. No body.
    BadRequest:
      description: |
        Malformed JSON, or a body that failed its constraints. Validation failures
        carry `fieldErrors`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            validation:
              summary: Validation failed
              value:
                status: 400
                error: Bad Request
                message: Validation failed
                fieldErrors:
                  - field: clusterName
                    message: Cluster name cannot be blank
    Unauthorized:
      description: |
        No token where one is required, or a token that is present but unusable. An
        invalid token also carries `WWW-Authenticate: Bearer error="invalid_token"`.
      headers:
        WWW-Authenticate:
          description: Present when the token was rejected.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but lacking the authority for this call.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such record — or, for a group, a record the caller has no standing to know
        exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: 404
            error: Not Found
            message: "Slurm cluster not found: c1d2e3f4-5678-4abc-9def-0123456789ab"
    Conflict:
      description: |
        The request collides with existing state — deleting an SSH key still in use,
        or a template that still has deployments.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: |
        The identity provider could not be reached to validate the token. Not the
        caller's fault, so it is not reported as an auth failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: |
        An unexpected server failure. The message is always `"Internal server error"`;
        the detail is logged rather than returned, since it may name internal state.

        A `502` is also possible on any authenticated call if the identity provider is
        unreachable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------------------------------------- Errors

    FieldError:
      type: object
      description: One failed validation constraint.
      properties:
        field:
          type: string
          description: |
            The JSON path of the offending field, including indexes and nesting.
          examples:
            ["inputs[0].inputType", "defaultBatchJobConfig.wallTimeMinutes"]
        message: { type: string }
      required: [field, message]

    Error:
      type: object
      description: The envelope every failure response uses.
      properties:
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        error:
          type: string
          description: The standard reason phrase for `status`.
        message:
          type: string
          description: Human-readable detail.
        fieldErrors:
          type: array
          description: |
            Present only on request-body validation failures, listing every
            constraint that failed so a client can report all of them at once.
          items: { $ref: "#/components/schemas/FieldError" }
      required: [status, error, message]

    # ----------------------------------------------------------- Enums

    AuthMethod:
      type: string
      enum: [CILOGON, SYSTEM]
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
    GroupRole:
      type: string
      enum: [ADMIN, MODERATOR, MEMBER]
    GroupMemberStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ClusterPermission:
      type: string
      enum: [READ, WRITE]
    DataStoragePermission:
      type: string
      enum: [READ, WRITE]
    DataProductPermission:
      type: string
      enum: [READ, WRITE]
    DataStorageType:
      type: string
      enum: [SCP, HPC]
    ProvisionStatus:
      type: string
      description: |
        The lifecycle state of a registered dataset. `REGISTERD` is spelled that way
        on the wire.
      enum:
        [
          REGISTERD,
          PROVISIONING,
          PROVISIONED,
          DEPROVISIONING,
          DEPROVISIONED,
          FAILED,
        ]
    TemplateInputType:
      type: string
      enum: [STRING, INTEGER, FLOAT, BOOLEAN, FILE, FILE_LIST, DIRECTORY]
    TemplateOutputType:
      type: string
      enum: [FILE, FILE_LIST, DIRECTORY]
    ProcessType:
      type: string
      enum: [BATCH_JOB, CLOUD_JOB]
    ProcessStatusType:
      type: string
      enum: [CREATED, SUBMITTED, RUNNING, COMPLETED, FAILED]
    OnFailureAction:
      type: string
      enum: [RETRY, SKIP, EXIT]
    BatchJobStatusType:
      type: string
      description: |
        Airavata's own states (`SUBMITTED`, `SUBMISSION_FAILED`, `CANCELLING`,
        `CANCELLED`) plus the Slurm mail states parsed from job notifications.
      enum:
        - SUBMITTED
        - SUBMISSION_FAILED
        - CANCELLING
        - CANCELLED
        - BEGIN
        - REQUEUE
        - INVALID_DEPEND
        - STAGE_OUT
        - TIME_LIMIT
        - TIME_LIMIT_90
        - TIME_LIMIT_80
        - TIME_LIMIT_50
        - FAIL
        - END

    # ------------------------------------------------------------ IAM

    UserRegistration:
      type: object
      description: The create/update payload for a user.
      properties:
        userId: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        authMethod:
          oneOf:
            - { $ref: "#/components/schemas/AuthMethod" }
            - { type: "null" }
      required: [userId]

    UserResponse:
      type: object
      description: |
        The read model for a user. It deliberately omits email, auth method and roles.
      properties:
        userId: { type: string }
        status:
          oneOf:
            - { $ref: "#/components/schemas/UserStatus" }
            - { type: "null" }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        createdAt:
          type: integer
          format: int64
          description: Milliseconds since the epoch.
      required: [userId, status, firstName, lastName, createdAt]

    GroupRequest:
      type: object
      description: |
        The create/update payload for a group. There is no owner field: ownership
        comes from the token and is immutable.
      properties:
        groupName: { type: string }
      required: [groupName]

    GroupResponse:
      type: object
      description: |
        The read model for a group. Members are not inlined — read them through
        `/api/v1/groups/{groupId}/members`, which keeps a large group's listing out of
        every response that merely names it.
      properties:
        groupId: { type: string }
        groupName: { type: [string, "null"] }
        ownerId: { type: [string, "null"] }
        createdAt: { type: integer, format: int64 }
      required: [groupId, createdAt]

    GroupMemberRequest:
      type: object
      description: |
        Adds a user to a group. An omitted `groupRole` means `MEMBER`; an omitted
        `groupMemberStatus` means `ACTIVE`.
      properties:
        userId: { type: string }
        groupRole:
          oneOf:
            - { $ref: "#/components/schemas/GroupRole" }
            - { type: "null" }
        groupMemberStatus:
          oneOf:
            - { $ref: "#/components/schemas/GroupMemberStatus" }
            - { type: "null" }
      required: [userId]

    GroupMemberUpdate:
      type: object
      description: |
        Changes an existing membership. Both fields are optional and an omitted one is
        left as it stands.
      properties:
        groupRole:
          oneOf:
            - { $ref: "#/components/schemas/GroupRole" }
            - { type: "null" }
        groupMemberStatus:
          oneOf:
            - { $ref: "#/components/schemas/GroupMemberStatus" }
            - { type: "null" }

    GroupMemberResponse:
      type: object
      properties:
        groupId: { type: string }
        userId: { type: string }
        groupRole: { $ref: "#/components/schemas/GroupRole" }
        groupMemberStatus: { $ref: "#/components/schemas/GroupMemberStatus" }
      required: [groupId, userId, groupRole, groupMemberStatus]

    # ---------------------------------------------------- Credentials

    SSHKeyRequest:
      type: object
      description: |
        The create/update payload for a key. `privateKey` is required on create; an
        update that omits it keeps the stored secret. There is no owner field.
      properties:
        sshKeyName: { type: string }
        publicKey: { type: string }
        privateKey:
          type: [string, "null"]
          description: Write-only. Never returned by any read endpoint.
        passphrase:
          type: [string, "null"]
          description: Write-only. Never returned by any read endpoint.
      required: [sshKeyName, publicKey]

    SSHKeyResponse:
      type: object
      description: |
        The read model for a key. It has no private key or passphrase field at all —
        the secrets cannot leak through this endpoint because there is nowhere for
        them to go.
      properties:
        sshKeyId: { type: string, format: uuid }
        sshKeyName: { type: string }
        publicKey: { type: string }
        ownerId: { type: string }
      required: [sshKeyId, sshKeyName, publicKey, ownerId]

    # -------------------------------------------------------- Compute

    ClusterPartitionRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        maxRunTime: { type: [integer, "null"], format: int32 }
        maxNodes: { type: [integer, "null"], format: int32 }
        maxProcessors: { type: [integer, "null"], format: int32 }
        maxJobsInQueue: { type: [integer, "null"], format: int32 }
        maxMemory: { type: [integer, "null"], format: int64 }
        cpuPerNode: { type: [integer, "null"], format: int32 }
        defaultNodeCount: { type: [integer, "null"], format: int32 }
        defaultCpuCount: { type: [integer, "null"], format: int32 }
        defaultWalltime: { type: [integer, "null"], format: int64 }
        gres: { type: [string, "null"] }
        nodes: { type: [string, "null"] }
        isDefaultQueue: { type: [boolean, "null"] }
        isCheckpointable: { type: [boolean, "null"] }
      required: [name]

    ClusterPartitionResponse:
      type: object
      properties:
        partitionId: { type: string, format: uuid }
        clusterId: { type: [string, "null"], format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        maxRunTime: { type: [integer, "null"], format: int32 }
        maxNodes: { type: [integer, "null"], format: int32 }
        maxProcessors: { type: [integer, "null"], format: int32 }
        maxJobsInQueue: { type: [integer, "null"], format: int32 }
        maxMemory: { type: [integer, "null"], format: int64 }
        cpuPerNode: { type: [integer, "null"], format: int32 }
        defaultNodeCount: { type: [integer, "null"], format: int32 }
        defaultCpuCount: { type: [integer, "null"], format: int32 }
        defaultWalltime: { type: [integer, "null"], format: int64 }
        gres: { type: [string, "null"] }
        nodes: { type: [string, "null"] }
        isDefaultQueue: { type: [boolean, "null"] }
        isCheckpointable: { type: [boolean, "null"] }
      required: [partitionId, name]

    SlurmClusterRequest:
      type: object
      description: |
        The create/update payload for a cluster. It describes the machine only.
      properties:
        clusterName: { type: string }
        clusterDescription: { type: [string, "null"] }
        headnodeHost: { type: string }
        headnodePort: { type: integer, minimum: 1, maximum: 65535 }
        slurmHome:
          type: [string, "null"]
          description: |
            The install prefix the Slurm client commands are found under. A cluster
            that omits it runs them off the login shell's `PATH`.
        dataHost:
          type: [string, "null"]
          description: |
            The optional separate endpoint for data movement. A cluster that names
            neither `dataHost` nor `dataPort` stages through its head node.
        dataPort: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        partitions:
          type: [array, "null"]
          description: |
            Accepted on create only, so a cluster whose layout is already known
            arrives complete. An update carrying them is rejected.
          items: { $ref: "#/components/schemas/ClusterPartitionRequest" }
      required: [clusterName, headnodeHost, headnodePort]

    SlurmClusterResponse:
      type: object
      properties:
        slurmClusterId: { type: string, format: uuid }
        clusterName: { type: string }
        clusterDescription: { type: [string, "null"] }
        headnodeHost: { type: string }
        headnodePort: { type: integer }
        slurmHome: { type: [string, "null"] }
        dataHost: { type: [string, "null"] }
        dataPort: { type: [integer, "null"] }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/ClusterPartitionResponse" }
      required:
        [slurmClusterId, clusterName, headnodeHost, headnodePort, partitions]

    SlurmClusterConfigRequest:
      type: object
      description: |
        The create/update payload for a cluster login config. There is no owner field.
      properties:
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        slurmClusterId: { type: string, format: uuid }
        loginUser: { type: string }
        workRoot: { type: string }
        sshKeyId:
          type: string
          format: uuid
          description: Must be a key the caller owns.
      required: [slurmClusterId, loginUser, workRoot, sshKeyId]

    SlurmClusterConfigResponse:
      type: object
      description: |
        The cluster is inlined because a config is only meaningful together with the
        machine it logs in to. The key is inlined as its safe summary.
      properties:
        slurmClusterConfigId: { type: string, format: uuid }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        ownerId: { type: [string, "null"] }
        slurmClusterId: { type: string, format: uuid }
        slurmCluster:
          oneOf:
            - { $ref: "#/components/schemas/SlurmClusterResponse" }
            - { type: "null" }
        loginUser: { type: string }
        workRoot: { type: string }
        sshKeyId: { type: [string, "null"], format: uuid }
        sshKey:
          oneOf:
            - { $ref: "#/components/schemas/SSHKeyResponse" }
            - { type: "null" }
        permission:
          type: string
          description: |
            The caller's effective standing, present only on the listings that compute
            it (`/shared-with-me`).
          enum: [READ, WRITE]
      required: [slurmClusterConfigId, slurmClusterId, loginUser, workRoot]

    SlurmClusterConfigGroupSharingRequest:
      type: object
      properties:
        groupId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/ClusterPermission" }
            - { type: "null" }
      required: [groupId]

    SlurmClusterConfigUserSharingRequest:
      type: object
      properties:
        userId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/ClusterPermission" }
            - { type: "null" }
      required: [userId]

    SlurmClusterConfigSharingUpdate:
      type: object
      properties:
        permission: { $ref: "#/components/schemas/ClusterPermission" }
      required: [permission]

    SlurmClusterConfigGroupSharingResponse:
      type: object
      properties:
        slurmClusterConfigGroupSharingId: { type: string, format: uuid }
        slurmClusterConfigId: { type: string, format: uuid }
        groupId: { type: string }
        permission: { $ref: "#/components/schemas/ClusterPermission" }
      required:
        [
          slurmClusterConfigGroupSharingId,
          slurmClusterConfigId,
          groupId,
          permission,
        ]

    SlurmClusterConfigUserSharingResponse:
      type: object
      properties:
        slurmClusterConfigUserSharingId: { type: string, format: uuid }
        slurmClusterConfigId: { type: string, format: uuid }
        userId: { type: string }
        permission: { $ref: "#/components/schemas/ClusterPermission" }
      required:
        [
          slurmClusterConfigUserSharingId,
          slurmClusterConfigId,
          userId,
          permission,
        ]

    # ---------------------------------------------------- Application

    TemplateInput:
      type: object
      description: |
        One declared input, used for both reads and writes. `inputId` is echoed back
        on reads but ignored on writes.
      properties:
        inputId: { type: string, format: uuid }
        inputName: { type: string }
        displayName: { type: [string, "null"] }
        inputDescription: { type: [string, "null"] }
        inputType: { $ref: "#/components/schemas/TemplateInputType" }
        required:
          type: boolean
          description: |
            Spelled `required` on the wire, not `isRequired`.
      required: [inputName, inputType]

    TemplateOutput:
      type: object
      properties:
        outputId: { type: string, format: uuid }
        outputName: { type: string }
        displayName: { type: [string, "null"] }
        outputDescription: { type: [string, "null"] }
        outputType: { $ref: "#/components/schemas/TemplateOutputType" }
      required: [outputName, outputType]

    TemplateRequest:
      type: object
      properties:
        templateName: { type: string }
        templateDescription: { type: [string, "null"] }
        inputs:
          type: [array, "null"]
          description: Input names must be unique within a template.
          items: { $ref: "#/components/schemas/TemplateInput" }
        outputs:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TemplateOutput" }
      required: [templateName]

    TemplateResponse:
      type: object
      properties:
        templateId: { type: string, format: uuid }
        templateName: { type: [string, "null"] }
        templateDescription: { type: [string, "null"] }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/TemplateInput" }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/TemplateOutput" }
      required: [templateId, inputs, outputs]

    BatchJobConfigRequest:
      type: object
      description: The resource request carried by a deployment or a run.
      properties:
        wallTimeMinutes: { type: integer, format: int64, exclusiveMinimum: 0 }
        allocation: { type: string }
        cpus: { type: [integer, "null"], format: int32 }
        mem: { type: [string, "null"] }
        memPerCpu: { type: [string, "null"] }
        ntasksPerNode: { type: [integer, "null"], format: int32 }
        cpusPerTask: { type: [integer, "null"], format: int32 }
        nodes: { type: [integer, "null"], format: int32 }
        ntasks: { type: [integer, "null"], format: int32 }
        gres: { type: [string, "null"] }
        gpus: { type: [integer, "null"], format: int32 }
        memPerGpu: { type: [string, "null"] }
        cpusPerGpu: { type: [string, "null"] }
        gpusPerNode: { type: [integer, "null"], format: int32 }
        constraints: { type: [string, "null"] }
      required: [wallTimeMinutes, allocation]

    BatchJobConfigResponse:
      type: object
      properties:
        batchJobConfigId: { type: string, format: uuid }
        wallTimeMinutes: { type: integer, format: int64 }
        allocation: { type: string }
        cpus: { type: [integer, "null"], format: int32 }
        mem: { type: [string, "null"] }
        memPerCpu: { type: [string, "null"] }
        ntasksPerNode: { type: [integer, "null"], format: int32 }
        cpusPerTask: { type: [integer, "null"], format: int32 }
        nodes: { type: [integer, "null"], format: int32 }
        ntasks: { type: [integer, "null"], format: int32 }
        gres: { type: [string, "null"] }
        gpus: { type: [integer, "null"], format: int32 }
        memPerGpu: { type: [string, "null"] }
        cpusPerGpu: { type: [string, "null"] }
        gpusPerNode: { type: [integer, "null"], format: int32 }
        constraints: { type: [string, "null"] }
      required: [batchJobConfigId, wallTimeMinutes, allocation]

    BatchDeploymentRequest:
      type: object
      properties:
        templateId: { type: string, format: uuid }
        slurmClusterId: { type: [string, "null"], format: uuid }
        slurmRunSection:
          type: string
          description: The run script section a job of this deployment executes.
        defaultBatchJobConfig:
          allOf: [{ $ref: "#/components/schemas/BatchJobConfigRequest" }]
          description: |
            The resource request a run of this deployment starts from. A run carries
            its own copy and may depart from it.
        defaultPartition: { type: [string, "null"] }
      required: [templateId, slurmRunSection, defaultBatchJobConfig]

    BatchDeploymentResponse:
      type: object
      properties:
        deploymentId: { type: string, format: uuid }
        templateId: { type: [string, "null"], format: uuid }
        slurmClusterId: { type: [string, "null"], format: uuid }
        slurmRunSection: { type: string }
        defaultBatchJobConfig:
          oneOf:
            - { $ref: "#/components/schemas/BatchJobConfigResponse" }
            - { type: "null" }
        defaultPartition: { type: [string, "null"] }
      required: [deploymentId, slurmRunSection]

    # ----------------------------------------------------------- Data

    SCPDataStorageRequest:
      type: object
      description: |
        The create/update payload for a storage. There is no owner field.
      properties:
        dataName: { type: string }
        hostName: { type: string }
        port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          default: 22
        loginUser: { type: string }
        sshKeyId:
          type: string
          format: uuid
          description: Must be a key the caller owns.
      required: [dataName, hostName, loginUser, sshKeyId]

    SCPDataStorageResponse:
      type: object
      properties:
        dataId: { type: string, format: uuid }
        dataName: { type: [string, "null"] }
        ownerId: { type: [string, "null"] }
        hostName: { type: [string, "null"] }
        port: { type: [integer, "null"] }
        loginUser: { type: [string, "null"] }
        sshKeyId: { type: [string, "null"], format: uuid }
        sshKey:
          oneOf:
            - { $ref: "#/components/schemas/SSHKeyResponse" }
            - { type: "null" }
        permission:
          type: string
          description: |
            The caller's effective standing, present only on the listings that compute
            it (`/shared-with-me`).
          enum: [READ, WRITE]
      required: [dataId]

    SCPDataStorageGroupSharingRequest:
      type: object
      properties:
        groupId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataStoragePermission" }
            - { type: "null" }
      required: [groupId]

    SCPDataStorageUserSharingRequest:
      type: object
      properties:
        userId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataStoragePermission" }
            - { type: "null" }
      required: [userId]

    SCPDataStorageSharingUpdate:
      type: object
      properties:
        permission: { $ref: "#/components/schemas/DataStoragePermission" }
      required: [permission]

    SCPDataStorageGroupSharingResponse:
      type: object
      properties:
        dataStorageGroupSharingId: { type: string, format: uuid }
        dataStorageId: { type: [string, "null"], format: uuid }
        groupId: { type: [string, "null"] }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataStoragePermission" }
            - { type: "null" }
      required: [dataStorageGroupSharingId]

    SCPDataStorageUserSharingResponse:
      type: object
      properties:
        dataStorageUserSharingId: { type: string, format: uuid }
        dataStorageId: { type: [string, "null"], format: uuid }
        userId: { type: [string, "null"] }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataStoragePermission" }
            - { type: "null" }
      required: [dataStorageUserSharingId]

    DataProductRequest:
      type: object
      description: |
        The create/update payload for a registered dataset. There is no owner field
        and no provision status: a caller who could set either would be able to
        register a dataset as someone else's, or claim it was already provisioned.
      properties:
        dataName: { type: string }
        dataDescription: { type: [string, "null"] }
        isFile: { type: boolean }
        path: { type: string }
        dataStorageId: { type: string, format: uuid }
        dataStorageType:
          description: Defaults to `SCP`, the only kind `dataStorageId` resolves against.
          oneOf:
            - { $ref: "#/components/schemas/DataStorageType" }
            - { type: "null" }
      required: [dataName, isFile, path, dataStorageId]

    DataProductResponse:
      type: object
      properties:
        dataId: { type: string, format: uuid }
        dataName: { type: [string, "null"] }
        dataDescription: { type: [string, "null"] }
        isFile: { type: boolean }
        path: { type: [string, "null"] }
        provisionStatus:
          oneOf:
            - { $ref: "#/components/schemas/ProvisionStatus" }
            - { type: "null" }
        ownerId: { type: [string, "null"] }
        dataStorageId: { type: [string, "null"], format: uuid }
        dataStorageType: { $ref: "#/components/schemas/DataStorageType" }
        createdAt: { type: integer, format: int64 }
        permission:
          type: string
          description: |
            What the calling principal may do with this dataset — a property of the
            request rather than of the record, which is why it is not stored. Present
            only on the listings that compute it.
          enum: [READ, WRITE]
      required: [dataId, isFile, dataStorageType, createdAt]

    DataProductGroupSharingRequest:
      type: object
      properties:
        groupId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataProductPermission" }
            - { type: "null" }
      required: [groupId]

    DataProductUserSharingRequest:
      type: object
      properties:
        userId: { type: string }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataProductPermission" }
            - { type: "null" }
      required: [userId]

    DataProductSharingUpdate:
      type: object
      description: |
        The subject is fixed at creation; only the permission is editable.
      properties:
        permission: { $ref: "#/components/schemas/DataProductPermission" }
      required: [permission]

    DataProductGroupSharingResponse:
      type: object
      properties:
        dataProductGroupSharingId: { type: string, format: uuid }
        dataProductId: { type: [string, "null"], format: uuid }
        groupId: { type: [string, "null"] }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataProductPermission" }
            - { type: "null" }
      required: [dataProductGroupSharingId]

    DataProductUserSharingResponse:
      type: object
      properties:
        dataProductUserSharingId: { type: string, format: uuid }
        dataProductId: { type: [string, "null"], format: uuid }
        userId: { type: [string, "null"] }
        permission:
          oneOf:
            - { $ref: "#/components/schemas/DataProductPermission" }
            - { type: "null" }
      required: [dataProductUserSharingId]

    # -------------------------------------------------------- Process

    InputMapping:
      type: object
      description: |
        Binds one of the deployment template's declared inputs to a value for this
        run. `templateInputMappingId` is echoed back on reads but ignored on writes:
        an update replaces the mapping set wholesale.
      properties:
        templateInputMappingId: { type: string, format: uuid }
        templateInputId: { type: string, format: uuid }
        value:
          type: [string, "null"]
          description: |
            A JSON document, either `{"value": "..."}` for a single value or
            `{"values": [...]}` for a list.
      required: [templateInputId]

    OutputMapping:
      type: object
      properties:
        templateOutputMappingId: { type: string, format: uuid }
        templateOutputId: { type: string, format: uuid }
        value:
          type: [string, "null"]
          description: |
            A JSON document, either `{"value": "..."}` for a single value or
            `{"values": [...]}` for a list.
      required: [templateOutputId]

    BatchJobStatusResponse:
      type: object
      properties:
        batchProcessStatusId: { type: string, format: uuid }
        batchProcessId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BatchJobStatusType" }
        updatedAt:
          type: integer
          format: int64
          description: When the state was recorded, in milliseconds since the epoch.
      required: [batchProcessStatusId, batchProcessId, status, updatedAt]

    BatchProcessRequest:
      type: object
      description: |
        The `batchProcess` section of a process request. The resource request is
        carried here rather than copied from the deployment's default, which is what
        lets a caller ask for different resources for a particular run.
      properties:
        deploymentId: { type: string, format: uuid }
        jobId:
          type: [string, "null"]
          description: |
            The scheduler's identifier for the submitted job — writable rather than
            server-generated, because it is learned at submission time and recorded
            afterwards.
        batchJobConfig: { $ref: "#/components/schemas/BatchJobConfigRequest" }
        slurmClusterConfigId:
          type: string
          format: uuid
          description: |
            The cluster login config this run submits under. Required: a deployment
            names the machine but nobody's identity on it. Only a config the caller
            owns or that is shared with them is accepted.
        baseWorkDir:
          type: [string, "null"]
          description: |
            The parent directory on the cluster this run works under; it gets a
            subdirectory of its own beneath it, named for the process id, which is
            where file inputs are staged to and file outputs staged from.
        inputMappings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/InputMapping" }
        outputMappings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/OutputMapping" }
      required: [deploymentId, slurmClusterConfigId, batchJobConfig]

    BatchProcessResponse:
      type: object
      description: |
        The `batchProcess` section of a process response. The nested config is a
        snapshot of what this run actually asked for.
      properties:
        batchProcessId: { type: string, format: uuid }
        deploymentId: { type: [string, "null"], format: uuid }
        jobId: { type: [string, "null"] }
        batchJobConfig:
          oneOf:
            - { $ref: "#/components/schemas/BatchJobConfigResponse" }
            - { type: "null" }
        slurmClusterConfigId: { type: string, format: uuid }
        baseWorkDir: { type: [string, "null"] }
        inputMappings:
          type: array
          items: { $ref: "#/components/schemas/InputMapping" }
        outputMappings:
          type: array
          items: { $ref: "#/components/schemas/OutputMapping" }
        batchJobStatuses:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/BatchJobStatusResponse" }
        latestBatchJobStatus:
          oneOf:
            - { $ref: "#/components/schemas/BatchJobStatusResponse" }
            - { type: "null" }
      required:
        - batchProcessId
        - slurmClusterConfigId
        - inputMappings
        - outputMappings
        - batchJobStatuses

    ProcessRequest:
      type: object
      description: |
        The create/update payload for a process. There is no owner field. Which
        sections a body may carry follows from its type: a `BATCH_JOB` without a
        `batchProcess` describes no job at all, and a `batchProcess` on any other kind
        is a caller's mistake rather than something to store and ignore.
      properties:
        processType: { $ref: "#/components/schemas/ProcessType" }
        batchProcess:
          description: Required when `processType` is `BATCH_JOB`; rejected otherwise.
          oneOf:
            - { $ref: "#/components/schemas/BatchProcessRequest" }
            - { type: "null" }
      required: [processType]

    ProcessResponse:
      type: object
      description: |
        The read model for a process, with every section it carries nested inside it.
      properties:
        processId: { type: string, format: uuid }
        userId:
          type: [string, "null"]
          description: The owner, taken from the token at creation.
        processType:
          oneOf:
            - { $ref: "#/components/schemas/ProcessType" }
            - { type: "null" }
        lastStatusId: { type: [string, "null"], format: uuid }
        batchProcess:
          oneOf:
            - { $ref: "#/components/schemas/BatchProcessResponse" }
            - { type: "null" }
      required: [processId]

    StatusResponse:
      type: object
      description: |
        One recorded process status. There is no request counterpart: statuses are
        never created or updated from a client body.
      properties:
        processStatusId: { type: string, format: uuid }
        processId: { type: [string, "null"], format: uuid }
        status:
          oneOf:
            - { $ref: "#/components/schemas/ProcessStatusType" }
            - { type: "null" }
        log: { type: [string, "null"] }
        timestamp:
          type: [integer, "null"]
          format: int64
          description: When the status was recorded, in milliseconds since the epoch.
      required: [processStatusId]

    DataStagingTaskRequest:
      type: object
      description: |
        Both paths are required: a staging task that names neither where data comes
        from nor where it goes describes no transfer at all.
      properties:
        sourceDataStorageId: { type: [string, "null"], format: uuid }
        sourceDataStorageType:
          oneOf:
            - { $ref: "#/components/schemas/DataStorageType" }
            - { type: "null" }
        destinationDataStorageId: { type: [string, "null"], format: uuid }
        destinationDataStorageType:
          oneOf:
            - { $ref: "#/components/schemas/DataStorageType" }
            - { type: "null" }
        sourcePath: { type: string }
        destinationPath: { type: string }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"], minimum: 0 }
        taskOrder: { type: [integer, "null"], minimum: 0 }
      required: [sourcePath, destinationPath]

    DataStagingTaskResponse:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        processId: { type: [string, "null"], format: uuid }
        sourceDataStorageId: { type: [string, "null"], format: uuid }
        sourceDataStorageType:
          oneOf:
            - { $ref: "#/components/schemas/DataStorageType" }
            - { type: "null" }
        destinationDataStorageId: { type: [string, "null"], format: uuid }
        destinationDataStorageType:
          oneOf:
            - { $ref: "#/components/schemas/DataStorageType" }
            - { type: "null" }
        sourcePath: { type: [string, "null"] }
        destinationPath: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"] }
        taskOrder: { type: [integer, "null"] }
      required: [taskId]

    JobSubmissionTaskRequest:
      type: object
      properties:
        jobId:
          type: [string, "null"]
          description: |
            The scheduler's identifier for the submitted job — writable rather than
            server-generated.
        workingDir: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"], minimum: 0 }
        taskOrder: { type: [integer, "null"], minimum: 0 }

    JobSubmissionTaskResponse:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        processId: { type: [string, "null"], format: uuid }
        jobId: { type: [string, "null"] }
        workingDir: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"] }
        taskOrder: { type: [integer, "null"] }
      required: [taskId]

    JobMonitoringTaskRequest:
      type: object
      properties:
        jobId: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"], minimum: 0 }
        taskOrder: { type: [integer, "null"], minimum: 0 }

    JobMonitoringTaskResponse:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        processId: { type: [string, "null"], format: uuid }
        jobId: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"] }
        taskOrder: { type: [integer, "null"] }
      required: [taskId]

    InteractiveCommandTaskRequest:
      type: object
      properties:
        command: { type: string }
        output:
          type: [string, "null"]
          description: |
            The result of running the command — writable for the same reason `jobId`
            is, recorded once whatever executed it knows the answer.
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"], minimum: 0 }
        taskOrder: { type: [integer, "null"], minimum: 0 }
      required: [command]

    InteractiveCommandTaskResponse:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        processId: { type: [string, "null"], format: uuid }
        command: { type: [string, "null"] }
        output: { type: [string, "null"] }
        onFailure:
          oneOf:
            - { $ref: "#/components/schemas/OnFailureAction" }
            - { type: "null" }
        retryCount: { type: [integer, "null"] }
        taskOrder: { type: [integer, "null"] }
      required: [taskId]
