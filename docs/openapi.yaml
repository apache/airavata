        omitted `port` means 22.
      operationId: createSCPDataStorage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SCPDataStorageRequest" }
      responses:
        "201":
          description: The registered storage.
          content:
            application/json:
