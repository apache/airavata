  # ------------------------------------------------------------ Processes

  /api/v1/processes:
    get:
      tags: [Processes]
      summary: List processes
      description: |
        The unfiltered listing is admin only. Supplying `deploymentId` narrows it to
        the runs of one deployment, which is open to any authenticated caller.
      operationId: listProcesses
      parameters:
        - name: deploymentId
          in: query
          required: false
          description: Return only the runs of this deployment.
          schema: { type: string }
      responses:
        "200":
          description: The matching processes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Processes]
      summary: Create a process
      description: |
        The owner comes from the token. A `BATCH_JOB` must carry a `batchProcess`
        section; any other process type must not. The cluster config named there must
        be one the caller owns or that has been shared with them.
      operationId: createProcess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessRequest" }
      responses:
        "201":
          description: The created process.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/ProcessId"
    get:
      tags: [Processes]
      summary: Read a process
      description: Owner or admin. Every section the process carries is nested inside it.
      operationId: getProcess
      responses:
        "200":
          description: The process.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Processes]
      summary: Update a process
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. The input and output mapping sets
        are replaced wholesale.
      operationId: updateProcess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessRequest" }
      responses:
