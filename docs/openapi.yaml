  # ------------------------------------------------- Application templates

  /api/v1/application-templates:
    get:
      tags: [Application Templates]
      summary: List application templates
      description: Catalogue read; open without a token.
      operationId: listApplicationTemplates
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Every template, with its declarations inlined.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Application Templates]
      summary: Create an application template
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. Input names must be unique within
        a template.
      operationId: createApplicationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRequest" }
      responses:
        "201":
          description: The created template, with server-assigned declaration ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/application-templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Application Templates]
      summary: Read an application template
      description: Catalogue read; open without a token.
      operationId: getApplicationTemplate
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Application Templates]
      summary: Update an application template
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. Declarations are replaced
        wholesale: `inputId` and `outputId` in the body are ignored and child ids are
        regenerated rather than matched.
      operationId: updateApplicationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRequest" }
      responses:
        "200":
          description: The updated template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Application Templates]
      summary: Delete an application template
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. A template that still has
        deployments cannot be deleted: `409 Conflict`.
      operationId: deleteApplicationTemplate
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ----------------------------------------------------- Batch deployments

  /api/v1/slurm-deployments:
    get:
      tags: [Batch Deployments]
      summary: List batch deployments
      description: |
        Catalogue read; open without a token. Supply `templateId` to narrow the
        listing to one template's deployments.
      operationId: listBatchDeployments
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: templateId
          in: query
          required: false
          description: Return only the deployments of this template.
          schema: { type: string }
      responses:
        "200":
          description: The matching deployments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BatchDeploymentResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Batch Deployments]
      summary: Create a batch deployment
      description: |
        Requires `ADMIN` or `SUPER_ADMIN` authority. Binds a template to a cluster,
        with the run script section and the resource request a run of it starts from.
        Which identity a job submits under is a property of the run, so it is named on
        the process instead.
      operationId: createBatchDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchDeploymentRequest" }
      responses:
        "201":
          description: The created deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDeploymentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/slurm-deployments/{deploymentId}:
