  /api/v1/scp-data-storages:
    get:
      tags: [SCP Data Storages]
      summary: List all SCP data storages
      description: Requires `ADMIN` or `SUPER_ADMIN` authority.
      operationId: listSCPDataStorages
      responses:
        "200":
